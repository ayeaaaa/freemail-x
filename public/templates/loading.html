<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('mf:ui-theme') || 'null');
          var styles = ['calm', 'warm', 'tech'];
          var style = saved && styles.indexOf(saved.style) !== -1 ? saved.style : 'calm';
          var mode = saved && (saved.mode === 'light' || saved.mode === 'dark')
            ? saved.mode
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-style', style);
          document.documentElement.setAttribute('data-mode', mode);
        } catch (_) {}
      })();
    </script>
    <title>加载中 - 临时邮箱</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/theme-switcher.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text); position: relative; overflow-x: hidden;
      }
      footer{ position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: var(--text-3); font-size: 12px; opacity: .9; pointer-events: none; }
      .loading-container { text-align: center; padding: 2rem; background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-lg); position: relative; z-index: 1; }
      .logo { font-size: 4rem; margin-bottom: 1rem; animation: bounce 2s infinite; filter: drop-shadow(var(--shadow)); }
      .title { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 600; color: var(--text); }
      .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
      .status { font-size: 0.9rem; color: var(--text-3); margin-bottom: 0.5rem; font-weight: 500; }
      .progress { width: 200px; height: 4px; background: var(--surface-2); border-radius: 2px; margin: 0 auto; overflow: hidden; border: 1px solid var(--border); }
      .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; animation: progress 2s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg);} }
      @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0);} 40% { transform: translateY(-10px);} 60% { transform: translateY(-5px);} }
      @keyframes progress { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="loading-container">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <use href="/icons/sprites.svg#icon-mail"/>
        </svg>
      </div>
      <h1 class="title">临时邮箱</h1>
      <div class="spinner"></div>
      <div class="status">请稍候...</div>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>
    <div id="footer-slot"></div>
    <script src="/js/auth-guard.js" data-autorun="loading"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // 根据 URL 查询参数自定义状态文案：?status=...
        try {
          const u = new URL(location.href);
          const s = (u.searchParams.get('status') || '').trim();
          if (s) {
            const el = document.querySelector('.status');
            if (el) el.textContent = s;
          }
        } catch(_){ }
        (async function(){
          try{
            const res = await fetch('/templates/footer.html', { cache: 'no-cache' });
            const html = await res.text();
            const slot = document.getElementById('footer-slot');
            if (slot){ slot.outerHTML = html; setTimeout(()=>{ const y=document.getElementById('footer-year'); if (y) y.textContent = new Date().getFullYear(); },0); }
          }catch(_){ }
        })();
        // 预加载首页关键资源（模板和脚本），认证后可无缝切换
        try{ fetch('/templates/app.html', { cache: 'force-cache' }); }catch(_){ }
        try{
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'script';
          link.href = '/js/app.js';
          document.head.appendChild(link);
        }catch(_){ }
        // 已认证用户兜底重定向：检测 Cookie 则确保跳往目标（更短延时）
        try{
          var hasToken = document.cookie.split(';').some(function(c){ return c.trim().indexOf('iding-session=') === 0; });
          if (hasToken){
            var target = (function(){ try{ var u=new URL(location.href); var t=u.searchParams.get('redirect') || '/index.html'; if (t === '/' || t === '/html/app.html') t = '/index.html'; return t; }catch(_){ return '/index.html'; }})();
            // 减少延时时间
            setTimeout(function(){ try{ location.replace(target); }catch(_){ location.replace('/index.html'); } }, 100);
          }
        }catch(_){ }
      });
    </script>
    <script src="/js/theme.js"></script>
  </body>
</html>
